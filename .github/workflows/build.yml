name: AI Tools Daily

on:
  schedule:
    # GitHub 定时任务是"尽力而为",整点(尤其 UTC 00:00)最拥堵、常被延迟或丢弃。
    # 用两个错峰时间、且都在北京 8 点前,提高每天 8 点前刷新成功的概率。
    - cron: '30 23 * * *'   # 23:30 UTC = 北京 07:30
    - cron: '55 23 * * *'   # 23:55 UTC = 北京 07:55
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - run: python build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - id: deployment
        uses: actions/deploy-pages@v4
